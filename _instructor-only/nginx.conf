server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same job the load balancer takes over in Week 5 — route API calls to the
  # backend, serve everything else as static files.
  location /api/ {
    proxy_pass http://checkout-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
